; The firmware sample: the Sharp panel on an RP2350.
;
; This is the machine's own stack - the raspberrypi platform and the
; arduino-pico core the panel was brought up on - so `pio run -e rp2350_panel`
; builds a UF2 in `.pio/build/rp2350_panel/firmware.uf2`.
;
; The core, the target and the sample are compiled from the project's own
; directories; nothing here comes from uCNC.

[platformio]
src_dir = .
default_envs = rp2350_panel

[env:rp2350_panel]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
framework = arduino
board = generic_rp2350
board_build.core = earlephilhower
board_build.mcu = rp2350
board_build.f_cpu = 150000000L
debug_tool = cmsis-dap

build_flags =
    -D PICO_BOARD=\"waveshare_rp2350_pizero\"
    ; Upright by default. A panel bolted turned a quarter - the machine's own
    ; mounting - is one number, and the layout follows it: add
    ;     -D LVDS_PANEL_TURN=90
    ; (270 is the same quarter the other way round).
    ; The draw buffer is in SRAM: the small, fast target, where present() has
    ; nothing to copy because the scanout reads the buffer that is being drawn.
    ; The machine draws into a PSRAM backbuffer instead, because uCNC's own
    ; memory has to live in SRAM - a build that wants that adds
    ;     -D LVDS_TARGET_USE_PSRAM=1
    ; (and then present() copies PSRAM into SRAM every frame, which measured
    ; about 33 ms a frame with the whole scene on the panel).
    -I.
    -Icore
    -Ipanels
    -Itargets/rp2350
    -Isamples/common

build_src_filter =
    +<core/>
    +<targets/rp2350/>
    +<samples/common/>
    +<samples/rp2350_panel/>

; The same sample with its frame meter in: the loop runs flat out instead of
; holding 50 frames a second, and every sixty frames it prints what a frame
; costs. Watch it with `pio device monitor -p <port> -b 115200`.
[env:rp2350_panel_fps]
extends = env:rp2350_panel
build_flags =
    ${env:rp2350_panel.build_flags}
    -D LVDS_SAMPLE_FPS=1

; The frame meter against the PSRAM backbuffer the machine uses, for comparing
; the two: same scene, same meter, the copy in present() added back.
[env:rp2350_panel_psram_fps]
extends = env:rp2350_panel
build_flags =
    ${env:rp2350_panel.build_flags}
    -D LVDS_TARGET_USE_PSRAM=1
    -D LVDS_SAMPLE_FPS=1
