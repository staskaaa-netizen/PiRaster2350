; The firmware sample: the Sharp panel on an RP2350.
;
; This is the machine's own stack - the raspberrypi platform and the
; arduino-pico core the panel was brought up on - so `pio run -e rp2350_panel`
; builds a UF2 in `.pio/build/rp2350_panel/firmware.uf2`.
;
; The core, the target and the sample are compiled from the project's own
; directories; nothing here comes from uCNC.

[platformio]
src_dir = .
default_envs = rp2350_panel

[env:rp2350_panel]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform_packages = framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
framework = arduino
board = generic_rp2350
board_build.core = earlephilhower
board_build.mcu = rp2350
board_build.f_cpu = 150000000L
debug_tool = cmsis-dap

build_flags =
    -D PICO_BOARD=\"waveshare_rp2350_pizero\"
    ; Upright by default. A panel bolted turned a quarter - the machine's own
    ; mounting - is one number, and the layout follows it: add
    ;     -D LVDS_PANEL_TURN=90
    ; (270 is the same quarter the other way round).
    ; The machine draws into the PSRAM backbuffer and copies it into the SRAM
    ; framebuffer on present. A board without PSRAM reports it unavailable and
    ; the draw buffer stays in SRAM.
    -D LVDS_TARGET_USE_PSRAM=1
    -I.
    -Icore
    -Ipanels
    -Itargets/rp2350
    -Isamples/common

build_src_filter =
    +<core/>
    +<targets/rp2350/>
    +<samples/common/>
    +<samples/rp2350_panel/>
